<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop | MeatCrafters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
      color: #333;
    }

    header {
      background: #8b0000;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .info-box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      text-decoration: none;
      text-align: center;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      color: white;
    }

    .order-btn { background: #000; }
    .email-btn { background: #444; }
    .whatsapp-btn { background: #25D366; }

    .btn:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>MeatCrafters Shop</h1>
  <p>Quality Meat • Easy Ordering</p>
</header>

<div class="container">

  <div class="info-box">
    <h2>How to Order</h2>
    <p>
      Our full product range remains the same.  
      Choose your preferred ordering method below.
    </p>

    <div class="buttons">
      <!-- Link to your existing order page -->
      <a href="order.html" class="btn order-btn">
        🛒 Order via Website
      </a>

      <!-- Email order -->
      <a href="mailto:704trader@gmail.com?subject=MeatCrafters Order&body=Hello,%20I%20would%20like%20to%20place%20an%20order."
         class="btn email-btn">
        📧 Order via Email
      </a>

      <!-- WhatsApp order -->
      <a href="https://wa.me/263714893191?text=Hello%20MeatCrafters,%20I%20would%20like%20to%20place%20an%20order."
         class="btn whatsapp-btn"
         target="_blank">
        💬 Order via WhatsApp
      </a>
    </div>
  </div>

</div>

<footer>
  © 2026 MeatCrafters Butchery
</footer>

</body>
</html>
